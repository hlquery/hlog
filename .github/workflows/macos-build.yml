name: macOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake make pkg-config openssl@3

      - name: Configure Homebrew paths
        run: |
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-isystem ${OPENSSL_PREFIX}/include ${CPPFLAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${OPENSSL_PREFIX}/lib ${LDFLAGS}" >> "$GITHUB_ENV"

      - name: Configure
        run: ./configure

      - name: Build
        run: gmake
